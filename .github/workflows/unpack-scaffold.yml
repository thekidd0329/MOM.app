name: Unpack MOM scaffold

on:
  push:
    paths:
      - '.github/workflows/unpack-scaffold.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack scaffold into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mom_unpack
          mkdir .mom_unpack
          unzip -q MOM_scaffold.zip -d .mom_unpack
          cp -a .mom_unpack/MOM/. ./
          find . -type d -empty -not -path './.git*' -exec touch '{}/.gitkeep' \;
          rm -rf .mom_unpack MOM_scaffold.zip
      - name: Commit unpacked scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MOM scaffold bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Unpack and organize MOM scaffold'
          git push
