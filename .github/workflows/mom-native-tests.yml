name: MOM Native Tests

on:
  push:
    paths:
      - "apps/mom_native/**"
      - ".github/workflows/mom-native-tests.yml"
  pull_request:
    paths:
      - "apps/mom_native/**"
      - ".github/workflows/mom-native-tests.yml"

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mom_native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
