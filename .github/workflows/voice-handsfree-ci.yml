name: MOM Hands-Free Voice Safe CI

on:
  push:
    branches:
      - voice-handsfree-loop
    paths:
      - "apps/mom_native/**"
      - ".github/workflows/voice-handsfree-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mom_native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org app.mom --project-name mom_native .
          fi
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
