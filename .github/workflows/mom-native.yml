name: MOM Android Debug CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mom_native/**"
      - "tools/ensure_android_manifest.py"
      - "tools/verify_android_apk.py"
      - "tools/verify_mom_android_debug_contract.py"
      - "tools/verify_mom_1_1_0_ui_contract.py"
      - ".github/workflows/mom-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mom_native/**"
      - "tools/ensure_android_manifest.py"
      - "tools/verify_android_apk.py"
      - "tools/verify_mom_android_debug_contract.py"
      - "tools/verify_mom_1_1_0_ui_contract.py"
      - ".github/workflows/mom-native.yml"

concurrency:
  group: mom-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify fast debug CI contract
        run: python3 tools/verify_mom_android_debug_contract.py

      - name: Verify production PNG UI contract
        run: python3 tools/verify_mom_1_1_0_ui_contract.py

      - name: Generate Android debug workspace
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          flutter create --platforms=android --org app.mom --project-name mom_native "$BUILD_DIR"
          rm -rf "$BUILD_DIR/lib" "$BUILD_DIR/test" "$BUILD_DIR/assets"
          cp -a apps/mom_native/lib "$BUILD_DIR/lib"
          cp -a apps/mom_native/assets "$BUILD_DIR/assets"
          cp apps/mom_native/pubspec.yaml "$BUILD_DIR/pubspec.yaml"
          cp -a apps/mom_native/android/. "$BUILD_DIR/android/"
          python3 tools/ensure_android_manifest.py "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"

      - name: Build CrispASR for ARM64
        shell: bash
        run: |
          set -euo pipefail
          CRISP_ROOT="$RUNNER_TEMP/crispasr"
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          ABI="arm64-v8a"
          git clone --recursive --depth 1 --branch v0.8.25 https://github.com/CrispStrobe/CrispASR.git "$CRISP_ROOT"
          ANDROID_NDK_HOME="$ANDROID_NDK_ROOT" "$CRISP_ROOT/build-android.sh" --abi "$ABI"
          SOURCE="$CRISP_ROOT/build-android/$ABI"
          DESTINATION="$BUILD_DIR/android/app/src/main/jniLibs/$ABI"
          mkdir -p "$DESTINATION"
          find "$SOURCE" -type f -name 'lib*.so' -exec cp '{}' "$DESTINATION/" ';'
          test -f "$DESTINATION/libcrispasr.so"

      - name: Resolve dependencies
        working-directory: ${{ runner.temp }}/mom_android
        run: flutter pub get

      - name: Static analysis
        working-directory: ${{ runner.temp }}/mom_android
        run: flutter analyze --no-fatal-infos

      - name: Build ARM64 debug APK
        working-directory: ${{ runner.temp }}/mom_android
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          SOURCE_APK="$BUILD_DIR/build/app/outputs/flutter-apk/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -s "$SOURCE_APK"
          test -x "$APKSIGNER"
          CERTS="$("$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK" 2>&1)"
          printf '%s\n' "$CERTS"
          printf '%s\n' "$CERTS" | grep -Fqi 'Android Debug'

      - name: Package debug APK
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          SOURCE_APK="$BUILD_DIR/build/app/outputs/flutter-apk/app-debug.apk"
          MANIFEST="$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' apps/mom_native/pubspec.yaml)"
          VERSION_NAME="${APP_VERSION%%+*}"
          VERSION_CODE="${APP_VERSION##*+}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          SAFE_VERSION="${APP_VERSION/+/-}"
          APK_NAME="MOM-${SAFE_VERSION}-${SHORT_SHA}-debug.apk"
          OUTPUT_APK="$BUILD_DIR/build/app/outputs/flutter-apk/$APK_NAME"

          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$OUTPUT_APK"
          python3 tools/verify_android_apk.py "$OUTPUT_APK" "$BUILD_DIR/android/app/src/main/jniLibs/arm64-v8a" "$MANIFEST"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$OUTPUT_APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep '^package: ' | head -n 1)"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "name='app.mom.mom_native'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionName='$VERSION_NAME'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionCode='$VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -F 'application-debuggable'

          APK_SHA256="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"
          ARTIFACT_DIR="$BUILD_DIR/debug-artifact"
          mkdir -p "$ARTIFACT_DIR"
          cp "$OUTPUT_APK" "$ARTIFACT_DIR/$APK_NAME"
          {
            printf 'MOM Android debug build\n'
            printf 'version=%s\n' "$APP_VERSION"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'apk=%s\n' "$APK_NAME"
            printf 'abi=arm64-v8a\n'
            printf 'build_type=debug\n'
            printf 'signing_mode=android-debug\n'
            printf 'sha256=%s\n' "$APK_SHA256"
          } > "$ARTIFACT_DIR/MOM_BUILD.txt"

          echo "artifact_name=mom-android-debug-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/mom_android/debug-artifact/
          if-no-files-found: error
          retention-days: 14
