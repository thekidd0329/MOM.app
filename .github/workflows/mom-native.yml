name: MOM Native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mom_native/**"
      - "core_llm/**"
      - "learning_model/**"
      - "docs/**"
      - "tools/build_mom_knowledge.py"
      - "tools/stage_android_runtime_libs.py"
      - "tools/verify_android_apk.py"
      - ".github/workflows/mom-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mom_native/**"
      - "core_llm/**"
      - "learning_model/**"
      - "docs/**"
      - "tools/build_mom_knowledge.py"
      - "tools/stage_android_runtime_libs.py"
      - "tools/verify_android_apk.py"
      - ".github/workflows/mom-native.yml"

permissions:
  contents: read

jobs:
  test:
    name: Tests and variable validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build repository knowledge bundle
        run: python3 tools/build_mom_knowledge.py
      - name: Resolve Dart packages
        working-directory: apps/mom_native
        run: flutter pub get
      - name: Static analysis
        working-directory: apps/mom_native
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        working-directory: apps/mom_native
        run: flutter test
      - name: Supabase MOM sync health
        run: |
          set -euo pipefail
          body="$(curl -fsS -X POST -H 'content-type: application/json' -d '{"action":"health"}' https://ghdgrcwvpsxbarxmopdp.supabase.co/functions/v1/mom-sync)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'

  linux:
    name: Linux Mint package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev pulseaudio-utils ffmpeg
      - name: Build repository knowledge bundle
        run: python3 tools/build_mom_knowledge.py
      - name: Generate native Linux shell
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --org app.mom --project-name mom_native "$RUNNER_TEMP/mom_linux"
          rm -rf "$RUNNER_TEMP/mom_linux/lib" "$RUNNER_TEMP/mom_linux/test"
          cp -a apps/mom_native/lib "$RUNNER_TEMP/mom_linux/lib"
          cp -a apps/mom_native/test "$RUNNER_TEMP/mom_linux/test"
          cp apps/mom_native/pubspec.yaml "$RUNNER_TEMP/mom_linux/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/mom_linux/assets"
          cp -a apps/mom_native/assets "$RUNNER_TEMP/mom_linux/assets"
      - name: Build Linux release
        working-directory: ${{ runner.temp }}/mom_linux
        run: flutter pub get && flutter build linux --release
      - name: Package installable deb
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mom_deb"
          VERSION="$(awk '/^version:/ {print $2; exit}' apps/mom_native/pubspec.yaml)"
          test -n "$VERSION"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/mom" "$ROOT/usr/share/applications"
          cp -a "$RUNNER_TEMP/mom_linux/build/linux/x64/release/bundle/." "$ROOT/opt/mom/"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: mom
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: MOM
          Depends: libgtk-3-0, libsecret-1-0, pulseaudio-utils, ffmpeg
          Description: MOM native personal intelligence client
          EOF
          cat > "$ROOT/usr/share/applications/mom.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MOM
          Comment=Personal intelligence
          Exec=/opt/mom/mom_native
          Terminal=false
          Categories=Utility;
          StartupNotify=true
          EOF
          dpkg-deb --build "$ROOT" "$GITHUB_WORKSPACE/mom-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: mom-linux-amd64-deb
          path: mom-linux-amd64.deb

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build repository knowledge bundle
        run: python3 tools/build_mom_knowledge.py
      - name: Generate native Android shell
        run: |
          set -euo pipefail
          flutter create --platforms=android --org app.mom --project-name mom_native "$RUNNER_TEMP/mom_android"
          rm -rf "$RUNNER_TEMP/mom_android/lib" "$RUNNER_TEMP/mom_android/test"
          cp -a apps/mom_native/lib "$RUNNER_TEMP/mom_android/lib"
          cp -a apps/mom_native/test "$RUNNER_TEMP/mom_android/test"
          cp apps/mom_native/pubspec.yaml "$RUNNER_TEMP/mom_android/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/mom_android/assets"
          cp -a apps/mom_native/assets "$RUNNER_TEMP/mom_android/assets"
          git clone --recursive --depth 1 --branch v0.8.25 https://github.com/CrispStrobe/CrispASR.git "$RUNNER_TEMP/crispasr"
          ANDROID_NDK_HOME="$ANDROID_NDK_ROOT" "$RUNNER_TEMP/crispasr/build-android.sh" --abi arm64-v8a
          CRISP_BUILD="$RUNNER_TEMP/crispasr/build-android/arm64-v8a"
          CRISP_DEST="$RUNNER_TEMP/mom_android/android/app/src/main/jniLibs/arm64-v8a"
          python3 tools/stage_android_runtime_libs.py "$CRISP_BUILD" "$CRISP_DEST" libcrispasr.so
          test -f "$CRISP_DEST/libcrispasr.so"
          python3 - <<'PY'
          from pathlib import Path
          p = Path(r"${{ runner.temp }}/mom_android/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = []
          if 'android.permission.INTERNET' not in s:
              permissions.append('    <uses-permission android:name="android.permission.INTERNET" />')
          if 'android.permission.RECORD_AUDIO' not in s:
              permissions.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
          if permissions:
              s = s.replace(marker, marker + '\n' + '\n'.join(permissions))
          if '<queries>' not in s:
              queries = '''    <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
          '''
              s = s.replace('</manifest>', queries + '</manifest>')
          p.write_text(s)
          PY
      - name: Build Android release APK
        working-directory: ${{ runner.temp }}/mom_android
        run: flutter pub get && flutter build apk --release --target-platform android-arm64
      - name: Verify Android release APK
        run: |
          python3 tools/verify_android_apk.py \
            "$RUNNER_TEMP/mom_android/build/app/outputs/flutter-apk/app-release.apk" \
            "$RUNNER_TEMP/mom_android/android/app/src/main/jniLibs/arm64-v8a"
      - uses: actions/upload-artifact@v4
        with:
          name: mom-android-apk
          path: ${{ runner.temp }}/mom_android/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS compile check
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build repository knowledge bundle
        run: python3 tools/build_mom_knowledge.py
      - name: Generate native iOS shell
        run: |
          flutter create --platforms=ios --org app.mom --project-name mom_native "$RUNNER_TEMP/mom_ios"
          rm -rf "$RUNNER_TEMP/mom_ios/lib" "$RUNNER_TEMP/mom_ios/test"
          cp -a apps/mom_native/lib "$RUNNER_TEMP/mom_ios/lib"
          cp -a apps/mom_native/test "$RUNNER_TEMP/mom_ios/test"
          cp apps/mom_native/pubspec.yaml "$RUNNER_TEMP/mom_ios/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/mom_ios/assets"
          cp -a apps/mom_native/assets "$RUNNER_TEMP/mom_ios/assets"
          python3 - <<'PY'
          from pathlib import Path
          p = Path(r"${{ runner.temp }}/mom_ios/ios/Runner/Info.plist")
          s = p.read_text()
          if 'NSMicrophoneUsageDescription' not in s:
              insertion = '\n\t<key>NSMicrophoneUsageDescription</key>\n\t<string>MOM uses the microphone when you choose to talk with her.</string>\n'
              s = s.replace('\n</dict>', insertion + '</dict>')
          p.write_text(s)
          PY
      - name: Compile iOS without code signing
        working-directory: ${{ runner.temp }}/mom_ios
        run: flutter pub get && flutter build ios --release --no-codesign
      - name: Archive unsigned iOS app
        run: cd "$RUNNER_TEMP/mom_ios/build/ios/iphoneos" && ditto -c -k --sequesterRsrc --keepParent Runner.app "$GITHUB_WORKSPACE/mom-ios-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mom-ios-unsigned
          path: mom-ios-unsigned.zip
