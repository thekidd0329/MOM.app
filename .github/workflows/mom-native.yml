name: MOM 1.0.1 Unified Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mom_native/**"
      - "core_llm/**"
      - "supabase/functions/mom-sync/**"
      - "supabase/migrations/**"
      - "tools/ensure_android_manifest.py"
      - "tools/run_mom_emulator_ui.py"
      - "tools/validate_mom_runtime_prompt.py"
      - "tools/verify_android_apk.py"
      - "tools/verify_live_mom_runtime_config.py"
      - "tools/verify_mom_1_1_0_release_contract.py"
      - "tools/verify_mom_1_1_0_ui_contract.py"
      - ".github/workflows/mom-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mom_native/**"
      - "core_llm/**"
      - "supabase/functions/mom-sync/**"
      - "supabase/migrations/**"
      - "tools/ensure_android_manifest.py"
      - "tools/run_mom_emulator_ui.py"
      - "tools/validate_mom_runtime_prompt.py"
      - "tools/verify_android_apk.py"
      - "tools/verify_live_mom_runtime_config.py"
      - "tools/verify_mom_1_1_0_release_contract.py"
      - "tools/verify_mom_1_1_0_ui_contract.py"
      - ".github/workflows/mom-native.yml"

concurrency:
  group: mom-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Source, voice, and server contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Record Flutter toolchain
        run: flutter --version

      - name: Verify unified release ownership
        run: python3 tools/verify_mom_1_1_0_release_contract.py

      - name: Verify live plasma UI contract
        run: python3 tools/verify_mom_1_1_0_ui_contract.py

      - name: Verify canonical MOM prompt contract
        run: python3 tools/validate_mom_runtime_prompt.py

      - name: Verify server runtime source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('supabase/functions/mom-sync/index.ts').read_text()
          migration = Path('supabase/migrations/20260810021810_mom_110_server_runtime_config.sql').read_text()
          assert 'npm:@supabase/supabase-js@2.112.3' in source
          assert 'version: 6' in source
          assert 'action === "runtime_config"' in source
          assert '.eq("config_key", "mobile.runtime")' in source
          assert "'prompt_authority', 'mom-brain'" in migration
          assert "'model_authority', 'mom-brain'" in migration
          assert "'raw_memory_location', 'device_only'" in migration
          assert "'cloud_raw_chat_storage', false" in migration
          print('MOM server runtime source contract OK')
          PY

      - name: Resolve Dart packages
        working-directory: apps/mom_native
        run: flutter pub get

      - name: Static analysis
        working-directory: apps/mom_native
        run: flutter analyze --no-fatal-infos

      - name: Complete Flutter test suite
        working-directory: apps/mom_native
        run: flutter test

      - name: Verify live authenticated runtime config
        run: python3 tools/verify_live_mom_runtime_config.py

  build:
    name: Build and verify the one APK
    needs: source
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      apk_name: ${{ steps.identity.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the single Android build workspace
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          flutter create --platforms=android --org app.mom --project-name mom_native "$BUILD_DIR"
          rm -rf "$BUILD_DIR/lib" "$BUILD_DIR/test" "$BUILD_DIR/assets"
          cp -a apps/mom_native/lib "$BUILD_DIR/lib"
          cp -a apps/mom_native/test "$BUILD_DIR/test"
          cp -a apps/mom_native/assets "$BUILD_DIR/assets"
          cp apps/mom_native/pubspec.yaml "$BUILD_DIR/pubspec.yaml"
          cp -a apps/mom_native/android/. "$BUILD_DIR/android/"
          rm -f "$BUILD_DIR/test/widget_test.dart"
          python3 tools/ensure_android_manifest.py "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"

      - name: Build CrispASR for both release ABIs
        shell: bash
        run: |
          set -euo pipefail
          CRISP_ROOT="$RUNNER_TEMP/crispasr"
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          git clone --recursive --depth 1 --branch v0.8.25 https://github.com/CrispStrobe/CrispASR.git "$CRISP_ROOT"

          for ABI in arm64-v8a x86_64; do
            ANDROID_NDK_HOME="$ANDROID_NDK_ROOT" "$CRISP_ROOT/build-android.sh" --abi "$ABI"
            SOURCE="$CRISP_ROOT/build-android/$ABI"
            DESTINATION="$BUILD_DIR/android/app/src/main/jniLibs/$ABI"
            mkdir -p "$DESTINATION"
            find "$SOURCE" -type f -name 'lib*.so' -exec cp '{}' "$DESTINATION/" ';'
            test -f "$DESTINATION/libcrispasr.so"
            echo "Staged $(find "$DESTINATION" -type f -name 'lib*.so' | wc -l) native libraries for $ABI"
          done

      - name: Resolve release dependencies
        working-directory: ${{ runner.temp }}/mom_android
        run: flutter pub get

      - name: Build universal release APK once
        working-directory: ${{ runner.temp }}/mom_android
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Sign PR APK with isolated ephemeral CI key
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          SOURCE_APK="$BUILD_DIR/build/app/outputs/flutter-apk/app-release.apk"
          SIGNED_APK="$BUILD_DIR/build/app/outputs/flutter-apk/app-release-signed.apk"
          KEYSTORE="$RUNNER_TEMP/mom-ci-release.p12"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          export CI_KEY_PASSWORD="$(openssl rand -hex 32)"
          CI_KEY_ALIAS="mom-ci"
          trap 'rm -f "$KEYSTORE"' EXIT

          test -s "$SOURCE_APK"
          test -x "$APKSIGNER"
          keytool -genkeypair \
            -noprompt \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$CI_KEY_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 2 \
            -dname "CN=MOM CI, OU=CI, O=MOM, C=US"
          chmod 0600 "$KEYSTORE"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --ks-pass env:CI_KEY_PASSWORD \
            --key-pass env:CI_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$SOURCE_APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          ACTUAL_CERT_SHA256="$(
            keytool -exportcert \
              -keystore "$KEYSTORE" \
              -storepass "$CI_KEY_PASSWORD" \
              -alias "$CI_KEY_ALIAS" \
              | sha256sum \
              | awk '{print $1}'
          )"
          if [[ ! "$ACTUAL_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not calculate the ephemeral CI signing certificate fingerprint."
            exit 1
          fi

          mv "$SIGNED_APK" "$SOURCE_APK"
          printf '%s\n' "$ACTUAL_CERT_SHA256" > "$BUILD_DIR/release-cert.sha256"
          printf 'ci-ephemeral\n' > "$BUILD_DIR/signing-mode.txt"

      - name: Sign with the permanent MOM release key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          MOM_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOM_ANDROID_KEYSTORE_BASE64 }}
          MOM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOM_ANDROID_KEYSTORE_PASSWORD }}
          MOM_ANDROID_KEY_ALIAS: ${{ secrets.MOM_ANDROID_KEY_ALIAS }}
          MOM_ANDROID_KEY_PASSWORD: ${{ secrets.MOM_ANDROID_KEY_PASSWORD }}
          MOM_ANDROID_CERT_SHA256: ${{ secrets.MOM_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for NAME in \
            MOM_ANDROID_KEYSTORE_BASE64 \
            MOM_ANDROID_KEYSTORE_PASSWORD \
            MOM_ANDROID_KEY_ALIAS \
            MOM_ANDROID_KEY_PASSWORD \
            MOM_ANDROID_CERT_SHA256; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::$NAME is required for a stable MOM release signature."
              exit 1
            fi
          done

          BUILD_DIR="$RUNNER_TEMP/mom_android"
          SOURCE_APK="$BUILD_DIR/build/app/outputs/flutter-apk/app-release.apk"
          SIGNED_APK="$BUILD_DIR/build/app/outputs/flutter-apk/app-release-signed.apk"
          KEYSTORE="$RUNNER_TEMP/mom-release.jks"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          trap 'rm -f "$KEYSTORE"' EXIT

          test -s "$SOURCE_APK"
          test -x "$APKSIGNER"
          printf '%s' "$MOM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 0600 "$KEYSTORE"
          test -s "$KEYSTORE"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$MOM_ANDROID_KEY_ALIAS" \
            --ks-pass env:MOM_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:MOM_ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$SOURCE_APK"

          CERTS="$("$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK" 2>&1)"
          printf '%s\n' "$CERTS"
          if printf '%s\n' "$CERTS" | grep -Fqi 'Android Debug'; then
            echo "::error::MOM release APK is signed with an Android Debug certificate."
            exit 1
          fi

          ACTUAL_CERT_SHA256="$(
            keytool -exportcert \
              -keystore "$KEYSTORE" \
              -storepass "$MOM_ANDROID_KEYSTORE_PASSWORD" \
              -alias "$MOM_ANDROID_KEY_ALIAS" \
              | sha256sum \
              | awk '{print $1}'
          )"
          EXPECTED_CERT_SHA256="$(
            printf '%s' "$MOM_ANDROID_CERT_SHA256" \
              | tr -d '[:space:]:' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if [[ ! "$ACTUAL_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not calculate the MOM release certificate fingerprint."
            exit 1
          fi
          if [[ ! "$EXPECTED_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::MOM_ANDROID_CERT_SHA256 must be one SHA-256 fingerprint."
            exit 1
          fi
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::MOM release certificate fingerprint does not match the pinned fingerprint."
            exit 1
          fi

          mv "$SIGNED_APK" "$SOURCE_APK"
          printf '%s\n' "$ACTUAL_CERT_SHA256" > "$BUILD_DIR/release-cert.sha256"
          printf 'permanent\n' > "$BUILD_DIR/signing-mode.txt"

      - name: Verify APK identity and native contents
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          SOURCE_APK="$BUILD_DIR/build/app/outputs/flutter-apk/app-release.apk"
          MANIFEST="$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' apps/mom_native/pubspec.yaml)"
          VERSION_NAME="${APP_VERSION%%+*}"
          VERSION_CODE="${APP_VERSION##*+}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          SAFE_VERSION="${APP_VERSION/+/-}"
          SIGNING_MODE="$(<"$BUILD_DIR/signing-mode.txt")"
          if [ "$SIGNING_MODE" = "ci-ephemeral" ]; then
            APK_KIND="ci"
          elif [ "$SIGNING_MODE" = "permanent" ]; then
            APK_KIND="release"
          else
            echo "::error::Unknown APK signing mode: $SIGNING_MODE"
            exit 1
          fi
          APK_NAME="MOM-${SAFE_VERSION}-${SHORT_SHA}-${APK_KIND}.apk"
          OUTPUT_APK="$BUILD_DIR/build/app/outputs/flutter-apk/$APK_NAME"

          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$OUTPUT_APK"
          python3 tools/verify_android_apk.py "$OUTPUT_APK" "$BUILD_DIR/android/app/src/main/jniLibs/arm64-v8a" "$MANIFEST"
          python3 tools/verify_android_apk.py "$OUTPUT_APK" "$BUILD_DIR/android/app/src/main/jniLibs/x86_64" "$MANIFEST"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          PACKAGE_LINE="$("$AAPT" dump badging "$OUTPUT_APK" | grep '^package: ' | head -n 1)"
          printf '%s\n' "$PACKAGE_LINE"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "name='app.mom.mom_native'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionName='$VERSION_NAME'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionCode='$VERSION_CODE'"

          APK_BYTES="$(stat -c '%s' "$OUTPUT_APK")"
          APK_SHA256="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"
          CERT_SHA256="$(<"$BUILD_DIR/release-cert.sha256")"
          {
            printf 'MOM Android 1.0.1\n'
            printf 'version=%s\n' "$APP_VERSION"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'apk=%s\n' "$APK_NAME"
            printf 'signing_mode=%s\n' "$SIGNING_MODE"
            printf 'bytes=%s\n' "$APK_BYTES"
            printf 'sha256=%s\n' "$APK_SHA256"
            printf 'cert_sha256=%s\n' "$CERT_SHA256"
            flutter --version | head -n 1
          } > "$BUILD_DIR/MOM_BUILD.txt"
          grep -E '^signing_mode=(ci-ephemeral|permanent)$' "$BUILD_DIR/MOM_BUILD.txt"
          grep -E '^sha256=[0-9a-f]{64}$' "$BUILD_DIR/MOM_BUILD.txt"
          grep -E '^cert_sha256=[0-9a-f]{64}$' "$BUILD_DIR/MOM_BUILD.txt"

          ARTIFACT_DIR="$BUILD_DIR/release-artifact"
          mkdir -p "$ARTIFACT_DIR"
          cp "$OUTPUT_APK" "$ARTIFACT_DIR/$APK_NAME"
          cp "$BUILD_DIR/MOM_BUILD.txt" "$ARTIFACT_DIR/MOM_BUILD.txt"

          echo "artifact_name=mom-android-1.0.1-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload the verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/mom_android/release-artifact/
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Verify that exact APK in Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: apk-artifact

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm."
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Complete onboarding and verify home/settings UI
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 tools/run_mom_emulator_ui.py apk-artifact ui-evidence

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-1.0.1-ui-evidence-${{ github.sha }}
          path: ui-evidence
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish the tested APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: apk-artifact

      - name: Publish public GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="apk-artifact/${{ needs.build.outputs.apk_name }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          test -s "$APK"
          test -s apk-artifact/MOM_BUILD.txt
          grep -F 'signing_mode=permanent' apk-artifact/MOM_BUILD.txt
          gh release create "mom-1.0.1-$SHORT_SHA" \
            "$APK#MOM-1.0.1.apk" \
            "apk-artifact/MOM_BUILD.txt#MOM_BUILD.txt" \
            --repo thekidd0329/MOM.app \
            --title "MOM 1.0.1 ($SHORT_SHA)" \
            --notes "Public MOM 1.0.1 APK. This binary passed source, native-library, package-identity, permanent-signature, and emulator UI verification and uses Android versionCode 10 for in-place updates from 1.0.1+9."
