name: Workload 1 Final Software Proof

on:
  push:
    branches:
      - update/1.0.1-ui-voice
    paths:
      - "apps/mom_native/**"
      - "supabase/functions/mom-brain-stream/**"
      - ".github/workflows/workload1-final-software-proof.yml"

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/1.0.1-ui-voice
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: apps/mom_native
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mom_native
        run: flutter analyze --no-fatal-infos
      - name: Full Flutter suite
        working-directory: apps/mom_native
        run: flutter test
      - name: Verify normal MOM brain health
        run: |
          set -euo pipefail
          body="$(curl -fsS -X POST -H 'content-type: application/json' -d '{"action":"health"}' https://ghdgrcwvpsxbarxmopdp.supabase.co/functions/v1/mom-brain)"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"configured":true'
      - name: Verify secure streaming brain authority
        run: |
          set -euo pipefail
          body="$(curl -fsS -X POST -H 'content-type: application/json' -d '{"action":"health"}' https://ghdgrcwvpsxbarxmopdp.supabase.co/functions/v1/mom-brain-stream)"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"client_system_prompt_accepted":false'
          echo "$body" | grep -q '"client_model_override_accepted":false'
          echo "$body" | grep -q '"server_authoritative_runtime_prompt":true'
      - name: Record Workload 1 software proof
        run: |
          set -euo pipefail
          mkdir -p builds
          cat > builds/workload1-voice-software-green.json <<EOF
          {
            "status": "GREEN",
            "workload": 1,
            "phases": 10,
            "verified_commit": "$GITHUB_SHA",
            "checks": [
              "flutter_analyze",
              "flutter_test",
              "mom_brain_health",
              "mom_brain_stream_authority"
            ],
            "apk_built": false,
            "physical_hands_free_proof": "pending_final_1.0.1_apk"
          }
          EOF
          git config user.name "MOM Phase Bot"
          git config user.email "actions@users.noreply.github.com"
          git add builds/workload1-voice-software-green.json
          git commit -m "Workload 1: record green voice software proof" || exit 0
          git push origin HEAD:update/1.0.1-ui-voice
