name: Publish MOM 1.0.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mom-public-release.yml"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, permanently sign, and publish MOM 1.0.1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 1.0.1+10' apps/mom_native/pubspec.yaml

      - name: Generate Android build workspace
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          flutter create --platforms=android --org app.mom --project-name mom_native "$BUILD_DIR"
          rm -rf "$BUILD_DIR/lib" "$BUILD_DIR/test" "$BUILD_DIR/assets"
          cp -a apps/mom_native/lib "$BUILD_DIR/lib"
          cp -a apps/mom_native/test "$BUILD_DIR/test"
          cp -a apps/mom_native/assets "$BUILD_DIR/assets"
          cp apps/mom_native/pubspec.yaml "$BUILD_DIR/pubspec.yaml"
          cp -a apps/mom_native/android/. "$BUILD_DIR/android/"
          rm -f "$BUILD_DIR/test/widget_test.dart"
          python3 tools/ensure_android_manifest.py "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"

      - name: Build CrispASR for release ABIs
        shell: bash
        run: |
          set -euo pipefail
          CRISP_ROOT="$RUNNER_TEMP/crispasr"
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          git clone --recursive --depth 1 --branch v0.8.25 https://github.com/CrispStrobe/CrispASR.git "$CRISP_ROOT"
          for ABI in arm64-v8a x86_64; do
            ANDROID_NDK_HOME="$ANDROID_NDK_ROOT" "$CRISP_ROOT/build-android.sh" --abi "$ABI"
            SOURCE="$CRISP_ROOT/build-android/$ABI"
            DEST="$BUILD_DIR/android/app/src/main/jniLibs/$ABI"
            mkdir -p "$DEST"
            find "$SOURCE" -type f -name 'lib*.so' -exec cp '{}' "$DEST/" ';'
            test -f "$DEST/libcrispasr.so"
          done

      - name: Build universal release APK
        working-directory: ${{ runner.temp }}/mom_android
        run: flutter pub get && flutter build apk --release --target-platform android-arm64,android-x64

      - name: Permanently sign and verify APK
        shell: bash
        env:
          SIGNING_BROKER_URL: https://ghdgrcwvpsxbarxmopdp.supabase.co/functions/v1/mom-release-signing
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          SOURCE_APK="$BUILD_DIR/build/app/outputs/flutter-apk/app-release.apk"
          SIGNED_APK="$BUILD_DIR/build/app/outputs/flutter-apk/MOM-1.0.1.apk"
          KEYSTORE="$RUNNER_TEMP/mom-release.p12"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          trap 'rm -f "$KEYSTORE"' EXIT

          test -s "$SOURCE_APK"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          OIDC_RESPONSE="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mom-release-signing")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -er '.value')"
          BUNDLE="$(curl -fsS -X POST -H "Authorization: Bearer $OIDC_TOKEN" "$SIGNING_BROKER_URL")"

          export MOM_ANDROID_KEYSTORE_BASE64="$(printf '%s' "$BUNDLE" | jq -er '.keystore_base64')"
          export MOM_ANDROID_KEYSTORE_PASSWORD="$(printf '%s' "$BUNDLE" | jq -er '.keystore_password')"
          export MOM_ANDROID_KEY_ALIAS="$(printf '%s' "$BUNDLE" | jq -er '.key_alias')"
          export MOM_ANDROID_KEY_PASSWORD="$(printf '%s' "$BUNDLE" | jq -er '.key_password')"
          export MOM_ANDROID_CERT_SHA256="$(printf '%s' "$BUNDLE" | jq -er '.cert_sha256')"
          unset BUNDLE OIDC_RESPONSE OIDC_TOKEN

          for NAME in MOM_ANDROID_KEYSTORE_BASE64 MOM_ANDROID_KEYSTORE_PASSWORD MOM_ANDROID_KEY_ALIAS MOM_ANDROID_KEY_PASSWORD MOM_ANDROID_CERT_SHA256; do
            echo "::add-mask::${!NAME}"
            test -n "${!NAME}"
          done

          printf '%s' "$MOM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 0600 "$KEYSTORE"
          test -s "$KEYSTORE"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$MOM_ANDROID_KEY_ALIAS" \
            --ks-pass env:MOM_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:MOM_ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$SOURCE_APK"

          CERTS="$("$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK" 2>&1)"
          printf '%s\n' "$CERTS"
          if printf '%s\n' "$CERTS" | grep -Fqi 'Android Debug'; then
            echo '::error::Public MOM APK must not use the Android Debug certificate.'
            exit 1
          fi

          ACTUAL_CERT_SHA256="$(keytool -exportcert -keystore "$KEYSTORE" -storepass "$MOM_ANDROID_KEYSTORE_PASSWORD" -alias "$MOM_ANDROID_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$MOM_ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          PACKAGE_LINE="$("$AAPT" dump badging "$SIGNED_APK" | grep '^package: ' | head -n 1)"
          printf '%s\n' "$PACKAGE_LINE"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "name='app.mom.mom_native'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionName='1.0.1'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionCode='10'"

          APK_SHA256="$(sha256sum "$SIGNED_APK" | awk '{print $1}')"
          APK_BYTES="$(stat -c '%s' "$SIGNED_APK")"
          {
            printf 'MOM Android 1.0.1\n'
            printf 'version=1.0.1+10\n'
            printf 'package=app.mom.mom_native\n'
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'apk=MOM-1.0.1.apk\n'
            printf 'signing_mode=permanent\n'
            printf 'bytes=%s\n' "$APK_BYTES"
            printf 'sha256=%s\n' "$APK_SHA256"
            printf 'cert_sha256=%s\n' "$ACTUAL_CERT_SHA256"
          } > "$BUILD_DIR/MOM_BUILD.txt"

      - name: Publish public GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/mom_android"
          APK="$BUILD_DIR/build/app/outputs/flutter-apk/MOM-1.0.1.apk"
          test -s "$APK"
          test -s "$BUILD_DIR/MOM_BUILD.txt"
          grep -F 'signing_mode=permanent' "$BUILD_DIR/MOM_BUILD.txt"
          gh release create v1.0.1 \
            "$APK#MOM-1.0.1.apk" \
            "$BUILD_DIR/MOM_BUILD.txt#MOM_BUILD.txt" \
            --repo thekidd0329/MOM.app \
            --target "$GITHUB_SHA" \
            --title 'MOM 1.0.1' \
            --notes 'Public MOM 1.0.1 Android APK (versionCode 10). This release establishes the permanent MOM release certificate for future in-place updates. Earlier CI/debug-signed builds may require one uninstall/reinstall before joining this permanent update chain.'
