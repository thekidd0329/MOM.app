name: Workload 1 Phase 2 Hands Free

on:
  push:
    branches:
      - workload1/phase2-handsfree-loop
  pull_request:
    branches:
      - main
    paths:
      - "apps/mom_native/**"
      - ".github/workflows/workload1-phase2-handsfree.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Hands-free voice conversation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dart packages
        working-directory: apps/mom_native
        run: flutter pub get
      - name: Static analysis
        working-directory: apps/mom_native
        run: flutter analyze --no-fatal-infos
      - name: Voice state machine tests
        working-directory: apps/mom_native
        run: flutter test test/voice_conversation_controller_test.dart test/voice_handsfree_phase2_test.dart
      - name: Full Flutter test suite
        working-directory: apps/mom_native
        run: flutter test
      - name: Live MOM brain health
        run: |
          set -euo pipefail
          body="$(curl -fsS -X POST -H 'content-type: application/json' -d '{"action":"health"}' https://ghdgrcwvpsxbarxmopdp.supabase.co/functions/v1/mom-brain)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"configured":true'
          echo "$body" | grep -q '"service":"mom-brain"'
