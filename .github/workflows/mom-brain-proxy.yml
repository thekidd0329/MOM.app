name: MOM Brain Proxy

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/mom-brain/**"
      - "core_llm/mamallama/runtime_prompt.md"
      - ".github/workflows/mom-brain-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify server-owned model authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('supabase/functions/mom-brain/index.ts').read_text()
          assert 'function isForbiddenModel' in source, 'missing forbidden-model gate'
          assert 'model.toLowerCase().includes("deepseek")' in source, 'DeepSeek family is not explicitly forbidden'
          assert 'mom-brain ignored client model override' in source, 'client model override is not explicitly ignored'
          assert 'const model = await resolveModel();' in source, 'chat path is not using server-side model resolution'
          assert 'const requestedModel = safeText(body.model' not in source, 'client model authority was reintroduced'
          assert 'failspy/Smaug-Llama-3-70B-Instruct-abliterated-v3' in source, 'preferred MOM model is missing'
          print('MOM server-owned model authority contract OK')
          PY

      - name: MOM brain server smoke test
        env:
          MOM_SYNC_URL: https://ghdgrcwvpsxbarxmopdp.supabase.co/functions/v1/mom-sync
          MOM_BRAIN_URL: https://ghdgrcwvpsxbarxmopdp.supabase.co/functions/v1/mom-brain
        run: |
          set -euo pipefail

          device_id="mom-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-proxy"
          registration="$(curl --fail-with-body -sS -X POST \
            -H 'content-type: application/json' \
            -d "{\"action\":\"register\",\"device_id\":\"$device_id\",\"platform\":\"github-actions\",\"app_version\":\"ci\",\"metadata\":{\"temporary\":true}}" \
            "$MOM_SYNC_URL")"

          installation="$(REGISTRATION="$registration" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['REGISTRATION'])
          print(data['installation_id'])
          PY
          )"
          token="$(REGISTRATION="$registration" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['REGISTRATION'])
          print(data['token'])
          PY
          )"

          cleanup() {
            curl -sS -X POST \
              -H 'content-type: application/json' \
              -H "x-mom-installation: $installation" \
              -H "x-mom-token: $token" \
              -d '{"action":"unregister_test"}' \
              "$MOM_BRAIN_URL" >/dev/null || true
          }
          trap cleanup EXIT

          health="$(curl --fail-with-body -sS -X POST \
            -H 'content-type: application/json' \
            -d '{"action":"health"}' \
            "$MOM_BRAIN_URL")"
          echo "$health"
          HEALTH="$health" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['HEALTH'])
          assert data.get('ok') is True, data
          assert data.get('configured') is True, 'HF_TOKEN is not configured in Supabase Edge Function secrets'
          PY

          models="$(curl --fail-with-body -sS -X POST \
            -H 'content-type: application/json' \
            -H "x-mom-installation: $installation" \
            -H "x-mom-token: $token" \
            -d '{"action":"models"}' \
            "$MOM_BRAIN_URL")"
          model="$(MODELS="$models" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['MODELS'])
          models = data.get('models') or []
          assert models, data
          print(data.get('default_model') or models[0])
          PY
          )"
          echo "MOM brain model discovery OK: $model"

          payload="$(MODEL="$model" python3 - <<'PY'
          import json, os
          print(json.dumps({
              'action': 'chat',
              'system_prompt': 'This is a transport health probe. Reply with one very short acknowledgement.',
              'history': [],
              'user_text': 'Reply with MOM_SERVER_OK.',
              'context_mode': 'none',
              'knowledge_context': '',
              'model': os.environ['MODEL'],
              'temperature': 0,
              'max_history': 2,
          }))
          PY
          )"

          chat_file="$(mktemp)"
          chat_status="$(curl -sS -o "$chat_file" -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "x-mom-installation: $installation" \
            -H "x-mom-token: $token" \
            -d "$payload" \
            "$MOM_BRAIN_URL")"
          chat="$(cat "$chat_file")"
          rm -f "$chat_file"
          echo "MOM brain chat HTTP $chat_status"
          if [[ "$chat_status" -lt 200 || "$chat_status" -ge 300 ]]; then
            CHAT="$chat" CHAT_STATUS="$chat_status" python3 - <<'PY'
          import json, os
          status = os.environ['CHAT_STATUS']
          try:
              data = json.loads(os.environ['CHAT'])
          except Exception:
              data = {}
          error = data.get('error', 'unknown_error')
          provider = data.get('provider_status')
          suffix = '' if provider is None else f' provider_http={provider}'
          print(f'MOM brain completion failed: http={status} error={error}{suffix}')
          PY
            echo "::error::MOM brain completion failed with HTTP $chat_status"
            exit 1
          fi

          CHAT="$chat" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['CHAT'])
          assert isinstance(data.get('text'), str) and data['text'].strip(), data
          assert isinstance(data.get('model'), str) and data['model'].strip(), data
          print('MOM brain proxy end-to-end OK:', data['model'])
          PY
