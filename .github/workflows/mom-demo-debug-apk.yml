name: MOM Demo Debug APK

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mom_native/**"
      - "tools/build_mom_knowledge.py"
      - "tools/verify_android_apk.py"
      - ".github/workflows/mom-demo-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build repository knowledge bundle
        run: python3 tools/build_mom_knowledge.py

      - name: Generate Android demo shell
        run: |
          set -euo pipefail
          flutter create --platforms=android --org app.mom --project-name mom_native "$RUNNER_TEMP/mom_demo_android"
          rm -rf "$RUNNER_TEMP/mom_demo_android/lib" "$RUNNER_TEMP/mom_demo_android/test"
          cp -a apps/mom_native/lib "$RUNNER_TEMP/mom_demo_android/lib"
          cp -a apps/mom_native/test "$RUNNER_TEMP/mom_demo_android/test"
          cp apps/mom_native/pubspec.yaml "$RUNNER_TEMP/mom_demo_android/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/mom_demo_android/assets"
          cp -a apps/mom_native/assets "$RUNNER_TEMP/mom_demo_android/assets"

          git clone --recursive --depth 1 --branch v0.8.25 https://github.com/CrispStrobe/CrispASR.git "$RUNNER_TEMP/crispasr"

          for abi in arm64-v8a x86_64; do
            ANDROID_NDK_HOME="$ANDROID_NDK_ROOT" "$RUNNER_TEMP/crispasr/build-android.sh" --abi "$abi"
            CRISP_BUILD="$RUNNER_TEMP/crispasr/build-android/$abi"
            CRISP_DEST="$RUNNER_TEMP/mom_demo_android/android/app/src/main/jniLibs/$abi"
            mkdir -p "$CRISP_DEST"
            mapfile -t crisp_libs < <(find "$CRISP_BUILD" -type f -name 'lib*.so' -print)
            if [ "${#crisp_libs[@]}" -eq 0 ]; then
              echo "::error::CrispASR Android build produced no shared libraries for $abi"
              exit 1
            fi
            cp "${crisp_libs[@]}" "$CRISP_DEST/"
            test -f "$CRISP_DEST/libcrispasr.so"
            echo "Packaged ${#crisp_libs[@]} CrispASR libraries for $abi"
          done

          python3 - <<'PY'
          from pathlib import Path
          p = Path(r"${{ runner.temp }}/mom_demo_android/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = []
          if 'android.permission.INTERNET' not in s:
              permissions.append('    <uses-permission android:name="android.permission.INTERNET" />')
          if 'android.permission.RECORD_AUDIO' not in s:
              permissions.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
          if permissions:
              s = s.replace(marker, marker + '\n' + '\n'.join(permissions))
          if '<queries>' not in s:
              queries = '''    <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
          '''
              s = s.replace('</manifest>', queries + '</manifest>')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/mom_demo_android
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --debug --target-platform android-arm64,android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/mom-demo-debug.apk"
          test -s "$GITHUB_WORKSPACE/mom-demo-debug.apk"

      - name: Preserve built demo APK
        uses: actions/upload-artifact@v4
        with:
          name: mom-demo-debug-apk
          path: mom-demo-debug.apk
          if-no-files-found: error

      - name: Verify debug APK payload
        run: |
          python3 tools/verify_android_apk.py \
            "$GITHUB_WORKSPACE/mom-demo-debug.apk" \
            "$RUNNER_TEMP/mom_demo_android/android/app/src/main/jniLibs/arm64-v8a"

      - name: Install and launch MOM in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r "$GITHUB_WORKSPACE/mom-demo-debug.apk"
            adb shell am force-stop app.mom.mom_native
            adb shell am start -W -n app.mom.mom_native/.MainActivity | tee "$GITHUB_WORKSPACE/mom-demo-start.txt"
            grep -q "Status: ok" "$GITHUB_WORKSPACE/mom-demo-start.txt"
            sleep 8
            pid="$(adb shell pidof app.mom.mom_native | tr -d '\r')"
            test -n "$pid"
            echo "MOM process pid=$pid"
            adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/mom-demo-activity.txt"
            grep -q "app.mom.mom_native" "$GITHUB_WORKSPACE/mom-demo-activity.txt"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/mom-demo-launch.png"
            test -s "$GITHUB_WORKSPACE/mom-demo-launch.png"

      - name: Upload emulator launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-demo-launch-evidence
          if-no-files-found: ignore
          path: |
            mom-demo-start.txt
            mom-demo-activity.txt
            mom-demo-launch.png
