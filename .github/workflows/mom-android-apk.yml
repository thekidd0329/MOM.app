name: MOM Android APK

on:
  push:
    branches:
      - main
    paths:
      - "apps/mom_native/**"
      - ".github/workflows/mom-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mom_native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold in runner
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org app.mom --project-name mom_native .
          fi
          # flutter create generates a demo widget test for MyApp, but MOM has
          # its own entrypoint/tests. Never let the generated sample block APK CI.
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Resolve build identity
        id: build_identity
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          SHORT_SHA="${GITHUB_SHA::7}"
          test -n "$APP_VERSION"
          test -n "$SHORT_SHA"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          printf 'MOM Android APK\nversion=%s\ncommit=%s\n' "$APP_VERSION" "$GITHUB_SHA" > MOM_BUILD.txt

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify actual APK identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$SOURCE_APK"

          APP_VERSION="${{ steps.build_identity.outputs.app_version }}"
          EXPECTED_VERSION_NAME="${APP_VERSION%%+*}"
          EXPECTED_VERSION_CODE="${APP_VERSION##*+}"
          if [ "$EXPECTED_VERSION_NAME" = "$APP_VERSION" ]; then
            EXPECTED_VERSION_CODE="1"
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$SOURCE_APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep '^package: ' | head -n 1)"

          printf '%s\n' "$PACKAGE_LINE"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "name='app.mom.mom_native'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionName='$EXPECTED_VERSION_NAME'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionCode='$EXPECTED_VERSION_CODE'"

          printf 'verified_package=%s\nverified_version_name=%s\nverified_version_code=%s\n' \
            'app.mom.mom_native' "$EXPECTED_VERSION_NAME" "$EXPECTED_VERSION_CODE" >> MOM_BUILD.txt

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="build/app/outputs/flutter-apk/app-debug.apk"
          OUTPUT_APK="build/app/outputs/flutter-apk/MOM-${{ steps.build_identity.outputs.app_version }}-${{ steps.build_identity.outputs.short_sha }}-debug.apk"
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$OUTPUT_APK"
          test -s "$OUTPUT_APK"
          APK_BYTES="$(stat -c '%s' "$OUTPUT_APK")"
          APK_SHA256="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"
          printf 'apk=%s\nbytes=%s\nsha256=%s\n' "$(basename "$OUTPUT_APK")" "$APK_BYTES" "$APK_SHA256" >> MOM_BUILD.txt
          grep -E '^sha256=[0-9a-f]{64}$' MOM_BUILD.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mom-android-debug-${{ steps.build_identity.outputs.app_version }}-${{ steps.build_identity.outputs.short_sha }}
          path: |
            apps/mom_native/build/app/outputs/flutter-apk/MOM-${{ steps.build_identity.outputs.app_version }}-${{ steps.build_identity.outputs.short_sha }}-debug.apk
            apps/mom_native/MOM_BUILD.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified APK to private download repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "APK_REPO_TOKEN is not configured; skipping private release publish."
            exit 0
          fi

          APP_VERSION="${{ steps.build_identity.outputs.app_version }}"
          SHORT_SHA="${{ steps.build_identity.outputs.short_sha }}"
          OUTPUT_APK="build/app/outputs/flutter-apk/MOM-${APP_VERSION}-${SHORT_SHA}-debug.apk"
          TAG="mom-${APP_VERSION}-${SHORT_SHA}"

          test -s "$OUTPUT_APK"
          test -s MOM_BUILD.txt

          gh release create "$TAG" \
            "$OUTPUT_APK#MOM.apk" \
            "MOM_BUILD.txt#MOM_BUILD.txt" \
            --repo thekidd0329/Cleantestapp \
            --title "MOM ${APP_VERSION} (${SHORT_SHA})" \
            --notes "Verified MOM Android build from the private source repository. Download MOM.apk below."

      - name: Publish latest build manifest
        if: ${{ always() }}
        shell: bash
        env:
          BUILD_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          ROOT="$(git rev-parse --show-toplevel)"
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          SHORT_SHA="${GITHUB_SHA::7}"
          ARTIFACT="mom-android-debug-${APP_VERSION}-${SHORT_SHA}"

          for ATTEMPT in 1 2 3; do
            git -C "$ROOT" fetch origin main

            EXISTING_RUN=0
            if git -C "$ROOT" cat-file -e origin/main:builds/latest_android.json 2>/dev/null; then
              EXISTING_RUN="$(git -C "$ROOT" show origin/main:builds/latest_android.json | python3 -c 'import json,sys; print(int(json.load(sys.stdin).get("run_id",0)))' 2>/dev/null || echo 0)"
            fi

            if [ "$EXISTING_RUN" -ge "$GITHUB_RUN_ID" ]; then
              echo "A newer or equal build manifest already exists."
              exit 0
            fi

            git -C "$ROOT" checkout -B build-manifest origin/main
            mkdir -p "$ROOT/builds"
            python3 - "$ROOT/builds/latest_android.json" "$BUILD_RESULT" "$APP_VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ARTIFACT" <<'PY'
          import json
          import sys
          from pathlib import Path

          path, result, version, commit, run_id, artifact = sys.argv[1:]
          Path(path).write_text(json.dumps({
              "result": result,
              "version": version,
              "commit": commit,
              "run_id": int(run_id),
              "artifact": artifact,
          }, indent=2) + "\n")
          PY

            git -C "$ROOT" config user.name "MOM Build Bot"
            git -C "$ROOT" config user.email "actions@users.noreply.github.com"
            git -C "$ROOT" add builds/latest_android.json
            git -C "$ROOT" commit -m "Record MOM Android build ${BUILD_RESULT}" || exit 0
            if git -C "$ROOT" push origin HEAD:main; then
              exit 0
            fi
            echo "Manifest push raced with another commit; retrying."
          done

          echo "Could not publish latest build manifest after retries."
          exit 1
