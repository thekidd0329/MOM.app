name: MOM Android APK

on:
  push:
    branches:
      - main
    paths:
      - "apps/mom_native/**"
      - ".github/workflows/mom-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mom_native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold in runner
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org app.mom --project-name mom_native .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Resolve build identity
        id: build_identity
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          SHORT_SHA="${GITHUB_SHA::7}"
          test -n "$APP_VERSION"
          test -n "$SHORT_SHA"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          printf 'MOM Android APK\nversion=%s\ncommit=%s\n' "$APP_VERSION" "$GITHUB_SHA" > MOM_BUILD.txt

          python3 - "$APP_VERSION" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          source = Path('lib/src/mom_home_screen.dart')
          text = source.read_text()
          old = "'Version 1.0.0'"
          if old not in text:
              raise SystemExit('Expected MOM version badge marker was not found')
          source.write_text(text.replace(old, f"'Version {version}'", 1))
          PY

          grep -F "'Version $APP_VERSION'" lib/src/mom_home_screen.dart

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mom-android-debug-${{ steps.build_identity.outputs.app_version }}-${{ steps.build_identity.outputs.short_sha }}
          path: |
            apps/mom_native/build/app/outputs/flutter-apk/app-debug.apk
            apps/mom_native/MOM_BUILD.txt
          if-no-files-found: error
          retention-days: 14
