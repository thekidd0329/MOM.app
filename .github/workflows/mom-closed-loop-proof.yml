name: MOM Closed Loop Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/mom-brain/**"
      - "supabase/functions/mom-intelligence/**"
      - "core_llm/mamallama/runtime_prompt.md"
      - ".github/workflows/mom-closed-loop-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    env:
      MOM_SYNC_URL: https://ghdgrcwvpsxbarxmopdp.supabase.co/functions/v1/mom-sync
      MOM_BRAIN_URL: https://ghdgrcwvpsxbarxmopdp.supabase.co/functions/v1/mom-brain
      MOM_INTELLIGENCE_URL: https://ghdgrcwvpsxbarxmopdp.supabase.co/functions/v1/mom-intelligence
    steps:
      - uses: actions/checkout@v4

      - name: Register disposable MOM installation
        id: register
        run: |
          set -euo pipefail
          device_id="mom-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-closed-loop"
          registration="$(curl --fail-with-body -sS -X POST \
            -H 'content-type: application/json' \
            -d "{\"action\":\"register\",\"device_id\":\"$device_id\",\"platform\":\"github-actions\",\"app_version\":\"ci-closed-loop\",\"metadata\":{\"temporary\":true}}" \
            "$MOM_SYNC_URL")"
          installation="$(REGISTRATION="$registration" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ['REGISTRATION'])['installation_id'])
          PY
          )"
          token="$(REGISTRATION="$registration" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ['REGISTRATION'])['token'])
          PY
          )"
          echo "installation=$installation" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Create structured memory from deidentified conversation context
        env:
          INSTALLATION: ${{ steps.register.outputs.installation }}
          TOKEN: ${{ steps.register.outputs.token }}
        run: |
          set -euo pipefail
          message="I'm stressed about a beta deadline. I need to deliver the MOM beta by 2026-08-10T23:00:00Z, and I need help prioritizing the beta."
          payload="$(MESSAGE="$message" python3 - <<'PY'
          import json, os
          message = os.environ['MESSAGE']
          print(json.dumps({
            'action': 'process_deidentified',
            'privacy_version': 'deid-v1',
            'sanitized_text': message,
            'original_characters': len(message),
            'redaction_count': 0,
            'redaction_kinds': [],
          }))
          PY
          )"
          result="$(curl --fail-with-body -sS -X POST \
            -H 'content-type: application/json' \
            -H "x-mom-installation: $INSTALLATION" \
            -H "x-mom-token: $TOKEN" \
            -d "$payload" \
            "$MOM_INTELLIGENCE_URL")"
          echo "$result"
          RESULT="$result" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RESULT'])
          assert data.get('ok') is True, data
          assert data.get('privacy_version') == 'deid-v1', data
          assert int(data.get('facts_produced', 0)) >= 1, data
          assert int(data.get('temporal_items', 0)) >= 1, data
          PY

      - name: Prove structured profile enters MOM awareness
        env:
          INSTALLATION: ${{ steps.register.outputs.installation }}
          TOKEN: ${{ steps.register.outputs.token }}
        run: |
          set -euo pipefail
          snapshot="$(curl --fail-with-body -sS -X POST \
            -H 'content-type: application/json' \
            -H "x-mom-installation: $INSTALLATION" \
            -H "x-mom-token: $TOKEN" \
            -d '{"action":"context_snapshot"}' \
            "$MOM_BRAIN_URL")"
          echo "$snapshot"
          SNAP="$snapshot" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['SNAP'])
          context=data.get('context','')
          assert data.get('ok') is True, data
          assert int(data.get('fact_count',0)) >= 1, data
          assert int(data.get('temporal_count',0)) >= 1, data
          assert 'MOM beta' in context or 'beta' in context.lower(), data
          assert 'What you remember about your person' in context, data
          assert 'What you know is time-sensitive' in context, data
          assert 'Tyler' not in context, 'identity-bearing test data leaked into awareness'
          print('CLOSED LOOP DEIDENTIFIED CONTEXT VERIFIED')
          PY

      - name: Prove Mother chat receives structured awareness
        env:
          INSTALLATION: ${{ steps.register.outputs.installation }}
          TOKEN: ${{ steps.register.outputs.token }}
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body -sS -X POST \
            -H 'content-type: application/json' \
            -H "x-mom-installation: $INSTALLATION" \
            -H "x-mom-token: $TOKEN" \
            -d '{"action":"chat","system_prompt":"ignored-client-test","history":[],"user_text":"What matters most right now?","knowledge_context":"","temperature":0,"max_history":2}' \
            "$MOM_BRAIN_URL")"
          echo "$result"
          RESULT="$result" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RESULT'])
          assert int(data.get('profile_facts_used',0)) >= 1, data
          assert int(data.get('temporal_items_used',0)) >= 1, data
          assert isinstance(data.get('text'), str) and data['text'].strip(), data
          assert 'deepseek' not in str(data.get('model','')).lower(), data
          print('MOTHER RECEIVED STRUCTURED DEIDENTIFIED AWARENESS')
          PY

      - name: Prove silent agents can bypass Mother memory
        env:
          INSTALLATION: ${{ steps.register.outputs.installation }}
          TOKEN: ${{ steps.register.outputs.token }}
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body -sS -X POST \
            -H 'content-type: application/json' \
            -H "x-mom-installation: $INSTALLATION" \
            -H "x-mom-token: $TOKEN" \
            -d '{"action":"chat","system_prompt":"ignored-client-test","history":[],"user_text":"OK","knowledge_context":"","temperature":0,"max_history":2,"context_mode":"none"}' \
            "$MOM_BRAIN_URL")"
          echo "$result"
          RESULT="$result" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RESULT'])
          assert int(data.get('profile_facts_used',-1)) == 0, data
          assert int(data.get('temporal_items_used',-1)) == 0, data
          assert 'deepseek' not in str(data.get('model','')).lower(), data
          print('INTERNAL AGENT CONTEXT ISOLATION VERIFIED')
          PY

      - name: Clean disposable closed-loop data
        if: always()
        env:
          INSTALLATION: ${{ steps.register.outputs.installation }}
          TOKEN: ${{ steps.register.outputs.token }}
        run: |
          if [ -z "${INSTALLATION:-}" ] || [ -z "${TOKEN:-}" ]; then exit 0; fi
          curl -sS -X POST \
            -H 'content-type: application/json' \
            -H "x-mom-installation: $INSTALLATION" \
            -H "x-mom-token: $TOKEN" \
            -d '{"action":"cleanup_test"}' \
            "$MOM_INTELLIGENCE_URL" >/dev/null || true
          curl -sS -X POST \
            -H 'content-type: application/json' \
            -H "x-mom-installation: $INSTALLATION" \
            -H "x-mom-token: $TOKEN" \
            -d '{"action":"unregister_test"}' \
            "$MOM_BRAIN_URL" >/dev/null || true
