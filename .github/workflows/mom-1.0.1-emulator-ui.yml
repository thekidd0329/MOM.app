name: MOM 1.0.1 Emulator UI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mom_native/**"
      - "tools/build_mom_knowledge.py"
      - "tools/ensure_android_manifest.py"
      - ".github/workflows/mom-1.0.1-emulator-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build repository knowledge bundle
        run: python3 tools/build_mom_knowledge.py

      - name: Generate Android emulator shell
        run: |
          set -euo pipefail
          flutter create --platforms=android --org app.mom --project-name mom_native "$RUNNER_TEMP/mom_ui_android"
          rm -rf "$RUNNER_TEMP/mom_ui_android/lib" "$RUNNER_TEMP/mom_ui_android/test"
          cp -a apps/mom_native/lib "$RUNNER_TEMP/mom_ui_android/lib"
          cp -a apps/mom_native/test "$RUNNER_TEMP/mom_ui_android/test"
          cp apps/mom_native/pubspec.yaml "$RUNNER_TEMP/mom_ui_android/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/mom_ui_android/assets"
          cp -a apps/mom_native/assets "$RUNNER_TEMP/mom_ui_android/assets"
          cp -a apps/mom_native/android/. "$RUNNER_TEMP/mom_ui_android/android/"

          git clone --recursive --depth 1 --branch v0.8.25 https://github.com/CrispStrobe/CrispASR.git "$RUNNER_TEMP/crispasr"
          ANDROID_NDK_HOME="$ANDROID_NDK_ROOT" "$RUNNER_TEMP/crispasr/build-android.sh" --abi x86_64
          CRISP_BUILD="$RUNNER_TEMP/crispasr/build-android/x86_64"
          CRISP_DEST="$RUNNER_TEMP/mom_ui_android/android/app/src/main/jniLibs/x86_64"
          mkdir -p "$CRISP_DEST"
          mapfile -t crisp_libs < <(find "$CRISP_BUILD" -type f -name 'lib*.so' -print)
          if [ "${#crisp_libs[@]}" -eq 0 ]; then
            echo "::error::CrispASR Android build produced no x86_64 shared libraries"
            exit 1
          fi
          cp "${crisp_libs[@]}" "$CRISP_DEST/"
          test -f "$CRISP_DEST/libcrispasr.so"
          python3 tools/ensure_android_manifest.py "$RUNNER_TEMP/mom_ui_android/android/app/src/main/AndroidManifest.xml"

      - name: Build emulator APK
        working-directory: ${{ runner.temp }}/mom_ui_android
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --debug --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/mom-1.0.1-ui-debug.apk"
          test -s "$GITHUB_WORKSPACE/mom-1.0.1-ui-debug.apk"

      - name: Launch home UI and verify settings
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: |
            set -euo pipefail
            PACKAGE=app.mom.mom_native
            adb install -r "$GITHUB_WORKSPACE/mom-1.0.1-ui-debug.apk"
            adb shell pm grant "$PACKAGE" android.permission.RECORD_AUDIO || true

            adb shell "run-as $PACKAGE mkdir -p shared_prefs"
            cat <<'EOF' | adb shell "run-as $PACKAGE sh -c 'cat > shared_prefs/FlutterSharedPreferences.xml'"
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map>
              <boolean name="flutter.mom_startup_intro_complete" value="true" />
              <boolean name="flutter.mom_startup_language" value="true" />
              <string name="flutter.mom_person_name">UI Test</string>
              <string name="flutter.mom_style">balanced</string>
              <string name="flutter.mom_startup_discovery_v1">{"answers":[],"signal_totals":{},"signal_weights":{},"domain_weights":{},"domain_hits":{},"complete":true}</string>
            </map>
            EOF

            echo "Injected MOM first-run preferences:"
            adb shell "run-as $PACKAGE cat shared_prefs/FlutterSharedPreferences.xml" || true

            adb shell am force-stop "$PACKAGE"
            adb shell am start -W -n "$PACKAGE/.MainActivity" | tee "$GITHUB_WORKSPACE/mom-ui-start.txt"
            sleep 8

            pid="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            if [ -z "$pid" ]; then
              echo "::error::MOM process is not alive after launch"
              exit 1
            fi
            echo "MOM pid=$pid"

            adb exec-out screencap -p > "$GITHUB_WORKSPACE/mom-home-live-plasma.png"
            test -s "$GITHUB_WORKSPACE/mom-home-live-plasma.png"
            adb shell uiautomator dump /sdcard/mom-home.xml >/dev/null || true
            adb pull /sdcard/mom-home.xml "$GITHUB_WORKSPACE/mom-home.xml" >/dev/null || true
            test -s "$GITHUB_WORKSPACE/mom-home.xml"
            cat "$GITHUB_WORKSPACE/mom-home.xml"

            read tap_x tap_y < <(python3 - <<'PY'
            import re
            import subprocess
            import xml.etree.ElementTree as ET

            root = ET.parse('mom-home.xml').getroot()
            for node in root.iter('node'):
                label = ' '.join((node.attrib.get('text', ''), node.attrib.get('content-desc', ''))).lower()
                if 'settings' not in label:
                    continue
                m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                if m:
                    x1, y1, x2, y2 = map(int, m.groups())
                    print((x1 + x2)//2, (y1 + y2)//2)
                    break
            else:
                size = subprocess.check_output(['adb', 'shell', 'wm', 'size'], text=True)
                m = re.search(r'(\d+)x(\d+)', size)
                if not m:
                    raise SystemExit('Could not resolve emulator screen size')
                width, _ = map(int, m.groups())
                print(width - 105, 175)
            PY
            )
            echo "Tapping Settings at $tap_x,$tap_y"
            adb shell input tap "$tap_x" "$tap_y"
            sleep 3

            adb shell uiautomator dump /sdcard/mom-settings.xml >/dev/null || true
            adb pull /sdcard/mom-settings.xml "$GITHUB_WORKSPACE/mom-settings.xml" >/dev/null || true
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/mom-settings.png"
            test -s "$GITHUB_WORKSPACE/mom-settings.png"
            test -s "$GITHUB_WORKSPACE/mom-settings.xml"
            cat "$GITHUB_WORKSPACE/mom-settings.xml"

            python3 - <<'PY'
            import xml.etree.ElementTree as ET
            root = ET.parse('mom-settings.xml').getroot()
            labels = []
            for node in root.iter('node'):
                labels.extend([node.attrib.get('text', ''), node.attrib.get('content-desc', '')])
            haystack = ' '.join(labels).lower()
            if 'mom settings' not in haystack:
                raise SystemExit('Settings screen did not open')
            print('MOM settings opened successfully')
            PY

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-1.0.1-ui-evidence
          if-no-files-found: ignore
          path: |
            mom-ui-start.txt
            mom-home.xml
            mom-settings.xml
            mom-home-live-plasma.png
            mom-settings.png
