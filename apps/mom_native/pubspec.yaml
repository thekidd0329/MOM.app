name: mom_native
description: Native MOM client for Linux, Android, and iOS.
publish_to: "none"
version: 1.0.0+8

environment:
  sdk: ">=3.5.0 <4.0.0"

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  http: ^1.2.2
  audioplayers: ^6.1.0
  speech_to_text: ^7.0.0
  crispasr:
    git:
      url: https://github.com/CrispStrobe/CrispASR.git
      ref: v0.8.25
      path: flutter/crispasr
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  record: ^7.1.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
