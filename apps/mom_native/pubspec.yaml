name: mom_native
description: Native MOM client for Linux, Android, and iOS.
publish_to: "none"
version: 0.2.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/runtime_prompt.md
    - assets/knowledge/mom_knowledge.jsonl

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
